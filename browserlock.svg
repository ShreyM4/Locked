<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">

  <defs>

    <!-- Background: emerald-to-teal diagonal gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#10B981"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>

    <!-- Glass fill for browser panel -->
    <linearGradient id="glassPanel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>

    <!-- Soft stroke gradient for browser frame border -->
    <linearGradient id="frameBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#0D9488" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glass fill for lock body -->
    <linearGradient id="lockGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.58"/>
    </linearGradient>

    <!-- Soft drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5"
                    flood-color="#064E3B" flood-opacity="0.38"/>
    </filter>

  </defs>

  <!-- App icon rounded background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>

  <!-- Ambient highlight blob (top-left) -->
  <ellipse cx="26" cy="20" rx="50" ry="32"
           fill="#ffffff" fill-opacity="0.07"/>

  <!-- Browser window glass panel -->
  <rect x="11" y="18" width="106" height="86" rx="9"
        fill="url(#glassPanel)"
        stroke="url(#frameBorder)" stroke-width="1.5"
        filter="url(#shadow)"/>

  <!-- Browser top bar -->
  <rect x="11" y="18" width="106" height="21" rx="9"
        fill="#ffffff" fill-opacity="0.16"/>
  <rect x="11" y="30" width="106" height="9"
        fill="#ffffff" fill-opacity="0.16"/>

  <!-- Tab-bar separator line -->
  <line x1="11" y1="39" x2="117" y2="39"
        stroke="#ffffff" stroke-opacity="0.14" stroke-width="1"/>

  <!-- Traffic light dots -->
  <circle cx="24" cy="29" r="3.5" fill="#FF6B6B" fill-opacity="0.88"/>
  <circle cx="35" cy="29" r="3.5" fill="#FFD93D" fill-opacity="0.88"/>
  <circle cx="46" cy="29" r="3.5" fill="#6BCB77" fill-opacity="0.88"/>

  <!-- URL / address bar -->
  <rect x="57" y="23" width="52" height="12" rx="6"
        fill="#ffffff" fill-opacity="0.13"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="0.8"/>

  <!-- Padlock shackle — outer (main stroke) -->
  <path d="M 51 71 C 51 50 77 50 77 71"
        fill="none"
        stroke="#ffffff" stroke-width="8.5" stroke-linecap="round"
        filter="url(#shadow)"/>

  <!-- Padlock shackle — inner highlight -->
  <path d="M 51 71 C 51 50 77 50 77 71"
        fill="none"
        stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"
        stroke-opacity="0.38"/>

  <!-- Lock body rectangle -->
  <rect x="42" y="67" width="44" height="34" rx="7"
        fill="url(#lockGlass)"
        filter="url(#shadow)"/>

  <!-- Lock body — top glass highlight strip -->
  <rect x="42" y="67" width="44" height="13" rx="7"
        fill="#ffffff" fill-opacity="0.25"/>

  <!-- Lock body — subtle border -->
  <rect x="42" y="67" width="44" height="34" rx="7"
        fill="none"
        stroke="#ffffff" stroke-opacity="0.22" stroke-width="1"/>

  <!-- Keyhole circle -->
  <circle cx="64" cy="81" r="5.5"
          fill="#10B981" fill-opacity="0.72"/>

  <!-- Keyhole stem slot -->
  <rect x="61.5" y="81" width="5" height="9" rx="2.5"
        fill="#10B981" fill-opacity="0.72"/>

</svg>