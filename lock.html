<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Locked</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="lock-container">
    <!-- Ambient glow -->
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="lock-card">
      <!-- Shield + Lock SVG icon -->
      <div class="lock-icon" aria-hidden="true">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" width="72" height="72">
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#a78bfa"/>
            </linearGradient>
          </defs>
          <path d="M32 4L8 16v16c0 14.4 10.24 27.84 24 32 13.76-4.16 24-17.6 24-32V16L32 4z"
                fill="url(#shieldGrad)" opacity="0.9"/>
          <rect x="23" y="31" width="18" height="14" rx="3" fill="rgba(255,255,255,0.92)"/>
          <path d="M27 31v-5a5 5 0 0 1 10 0v5" fill="none" stroke="rgba(255,255,255,0.92)"
                stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="32" cy="37" r="2" fill="#4338ca"/>
          <rect x="31.2" y="37" width="1.6" height="3.5" rx="0.8" fill="#4338ca"/>
        </svg>
      </div>

      <h1 class="lock-title">Browser Locked</h1>
      <p class="lock-subtitle">Enter your PIN to unlock</p>

      <div class="pin-wrapper">
        <input
          type="password"
          id="pin-input"
          class="pin-input"
          maxlength="16"
          inputmode="numeric"
          autocomplete="off"
          spellcheck="false"
          autofocus
          placeholder="••••••"
          aria-label="Enter PIN"
        >
      </div>

      <button id="unlock-btn" class="unlock-btn" type="button">
        <span class="btn-text">Unlock</span>
        <span class="btn-spinner" id="spinner" aria-hidden="true"></span>
      </button>

      <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>
      <div id="lockout-msg" class="lockout-msg" role="status" aria-live="polite"></div>
    </div>

    <p class="footer-note">Privacy-first • No data leaves your computer</p>
  </div>

  <script src="lock.js"></script>
</body>
</html>
