<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browser Locked</title>
  <link rel="stylesheet" href="lock.css">
</head>
<body>
  <div class="lock-container">
    
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="lock-card">
      
      <div class="lock-icon" aria-hidden="true">
        <img src="logo.svg" width="68" height="68" alt="Browser Lock">
      </div>

      <h1 class="lock-title">Browser Locked</h1>
      <p class="lock-subtitle">Enter your PIN to unlock</p>

      <div class="pin-wrapper">
        <input
          type="password"
          id="pin-input"
          class="pin-input"
          maxlength="16"
          inputmode="numeric"
          autocomplete="off"
          spellcheck="false"
          autofocus
          placeholder="••••••"
          aria-label="Enter PIN"
        >
      </div>

      <button id="unlock-btn" class="unlock-btn" type="button">
        <span class="btn-text">Unlock</span>
        <span class="btn-spinner" id="spinner" aria-hidden="true"></span>
      </button>

      <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>
      <div id="lockout-msg" class="lockout-msg" role="status" aria-live="polite"></div>

      <button id="forgot-pin-btn" class="forgot-pin-btn" type="button">
        Forgot PIN?
      </button>
    </div>

    <p class="footer-note">Privacy-first • No data leaves your computer</p>
  </div>

  <script src="lock.js"></script>
</body>
</html>
