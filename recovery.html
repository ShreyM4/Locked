<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Lock — Account Recovery</title>
  <link rel="stylesheet" href="recovery.css">
</head>
<body>
  <div class="recovery-container">
    
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="recovery-card">
      
      <div class="recovery-icon" aria-hidden="true">
        <img src="logo.svg" width="52" height="52" alt="Simple Lock">
      </div>

      <h1 class="recovery-title" id="view-title">Account Recovery</h1>
      <p class="recovery-subtitle" id="view-subtitle">Select a recovery option to reset your PIN</p>

      
      <div id="methods-view" class="view-section active">
        
        <div class="recovery-tabs">
          <button id="tab-totp-btn" class="rec-tab-btn active" type="button">App Code</button>
          <button id="tab-file-btn" class="rec-tab-btn" type="button">Saved Key / File</button>
        </div>

        
        <div id="totp-method-area" class="method-sub-area active">
          <div class="totp-field-group">
            <input
              type="text"
              id="totp-input"
              class="totp-input-box"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
              spellcheck="false"
              autofocus
              placeholder="000000"
              aria-label="6-digit Authenticator code"
            >
            <button id="totp-verify-btn" class="primary-btn" type="button">
              <span class="btn-text">Verify Code</span>
              <span class="btn-spinner" id="totp-spinner" aria-hidden="true"></span>
            </button>
          </div>
        </div>

        
        <div id="file-method-area" class="method-sub-area">
          <input type="file" id="key-file-input" style="display: none;">
          
          <button id="upload-file-btn" class="upload-file-box" type="button">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <span id="upload-box-text">Click to upload saved key file</span>
          </button>

          <div class="divider">
            <span>OR PASTE KEY</span>
          </div>

          <input
            type="text"
            id="manual-key-input"
            class="manual-key-input"
            autocomplete="off"
            spellcheck="false"
            placeholder="Paste manual Base32 key..."
            aria-label="Manual key text"
          >

          <button id="key-verify-btn" class="primary-btn" type="button" style="margin-top: 10px;">
            <span class="btn-text">Verify Key</span>
            <span class="btn-spinner" id="key-spinner" aria-hidden="true"></span>
          </button>
        </div>

        <button id="back-to-lock-btn" class="text-link-btn" type="button">
          ← Back to PIN Screen
        </button>
      </div>

      
      <div id="reset-pin-view" class="view-section">
        <div class="success-banner">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#34d399" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
            <polyline points="22 4 12 14.01 9 11.01"></polyline>
          </svg>
          <span>Identity Verified Successfully</span>
        </div>

        <div class="form-field">
          <label for="new-pin" class="field-label">Create New PIN (4–16 digits)</label>
          <input
            type="password"
            id="new-pin"
            class="text-input"
            maxlength="16"
            inputmode="numeric"
            autocomplete="off"
            placeholder="••••••"
            aria-label="New PIN"
          >
        </div>

        <div class="form-field">
          <label for="confirm-pin" class="field-label">Confirm New PIN</label>
          <input
            type="password"
            id="confirm-pin"
            class="text-input"
            maxlength="16"
            inputmode="numeric"
            autocomplete="off"
            placeholder="••••••"
            aria-label="Confirm New PIN"
          >
        </div>

        <button id="save-new-pin-btn" class="primary-btn" type="button">
          <span class="btn-text">Save New PIN &amp; Unlock</span>
          <span class="btn-spinner" id="save-spinner" aria-hidden="true"></span>
        </button>
      </div>

      <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>
    </div>

    <p class="footer-note">100% Offline Local Verification</p>
  </div>

  <script src="totp.js"></script>
  <script src="recovery.js"></script>
</body>
</html>
