<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set Up Browser Lock</title>
  <link rel="stylesheet" href="setup.css">
</head>
<body>
  <div class="setup-container">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>

    <div class="setup-card">
      
      <div class="setup-icon" aria-hidden="true">
        <img src="logo.svg" width="48" height="48" alt="Browser Lock">
      </div>

      <h1 class="setup-title">Set Up Browser Lock</h1>
      <p class="setup-subtitle">Create a PIN to protect this Chrome profile</p>

      
      <div id="step-create" class="step active">
        <label for="new-pin" class="field-label">Create a PIN (4–16 digits)</label>
        <div class="pin-wrapper">
          <input
            type="password"
            id="new-pin"
            class="pin-input"
            maxlength="16"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            autofocus
            placeholder="••••••"
            aria-label="Create PIN"
          >
        </div>
        <div id="pin-strength" class="pin-strength">
          <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
          <span class="strength-label" id="strength-label"></span>
        </div>
        <button id="next-btn" class="primary-btn" type="button">Continue</button>
      </div>

      
      <div id="step-confirm" class="step">
        <label for="confirm-pin" class="field-label">Confirm your PIN</label>
        <div class="pin-wrapper">
          <input
            type="password"
            id="confirm-pin"
            class="pin-input"
            maxlength="16"
            inputmode="numeric"
            autocomplete="off"
            spellcheck="false"
            placeholder="••••••"
            aria-label="Confirm PIN"
          >
        </div>
        <div class="button-row">
          <button id="back-btn" class="secondary-btn btn-sm-flex" type="button">Back</button>
          <button id="confirm-btn" class="primary-btn btn-lg-flex" type="button">
            <span class="btn-text">Next: Recovery</span>
          </button>
        </div>
      </div>

      
      <div id="step-totp" class="step">
        <div class="account-badge" id="setup-account-badge">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <span id="setup-account-email" class="account-email-text">Detecting profile email...</span>
        </div>

        <div id="qr-container" class="qr-box"></div>
        
        <div class="secret-display-wrap">
          <span class="secret-label">Manual Key:</span>
          <code id="secret-key-text" class="secret-key"></code>
        </div>

        <div class="verify-code-wrap">
          <input
            type="text"
            id="setup-totp-code"
            class="verify-code-input"
            maxlength="6"
            inputmode="numeric"
            autocomplete="one-time-code"
            spellcheck="false"
            placeholder="000000"
            aria-label="6-digit Authenticator verification code"
          >
        </div>

        <div class="button-row">
          <button id="back-to-step2-btn" class="secondary-btn btn-sm-flex" type="button">Back</button>
          <button id="finish-setup-btn" class="primary-btn btn-lg-flex" type="button">
            <span class="btn-text">Complete Setup &amp; Lock</span>
            <span class="btn-spinner" id="spinner" aria-hidden="true"></span>
          </button>
        </div>
      </div>

      <div id="error-msg" class="error-msg" role="alert" aria-live="polite"></div>
    </div>

    <p class="footer-note">Everything stays local — zero external data transfer</p>
  </div>

  <script src="totp.js"></script>
  <script src="setup.js"></script>
</body>
</html>
